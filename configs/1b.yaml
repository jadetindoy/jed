# ─────────────────────────────────────────────────────────────────────────────
# JedAI 1B — 1 Billion parameter model with GQA and extended context
# ─────────────────────────────────────────────────────────────────────────────
vocab_size:   32000
d_model:      2048
n_heads:      16
n_kv_heads:   8
n_layers:     16
max_seq_len:  4096
ffn_mult:     2.6875
rms_norm_eps: 1.0e-5
tie_word_embeddings: false
rope_theta:   10000.0
dropout:      0.0
attention_dropout: 0.0

lr:               1.5e-4
lr_min:           1.0e-5
weight_decay:     0.1
warmup_steps:     2000
max_steps:        500000
grad_clip:        1.0
grad_accum_steps: 32
batch_size:       4

log_every:  100
save_every: 5000
output_dir: checkpoints/1b
