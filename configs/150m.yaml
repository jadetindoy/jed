# ─────────────────────────────────────────────────────────────────────────────
# JedAI 150M — Mid-small model, good for language understanding tasks
# ─────────────────────────────────────────────────────────────────────────────
vocab_size:   32000
d_model:      768
n_heads:      12
n_kv_heads:   12
n_layers:     12
max_seq_len:  2048
ffn_mult:     2.6875
rms_norm_eps: 1.0e-5
tie_word_embeddings: true
rope_theta:   10000.0
dropout:      0.0
attention_dropout: 0.0

lr:               2.5e-4
lr_min:           1.0e-5
weight_decay:     0.1
warmup_steps:     1000
max_steps:        100000
grad_clip:        1.0
grad_accum_steps: 8
batch_size:       16

log_every:  20
save_every: 2000
output_dir: checkpoints/150m
