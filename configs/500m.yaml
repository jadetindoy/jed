# ─────────────────────────────────────────────────────────────────────────────
# JedAI 500M — Medium model with GQA for reduced KV-cache memory
# ─────────────────────────────────────────────────────────────────────────────
vocab_size:   32000
d_model:      1024
n_heads:      16
n_kv_heads:   8
n_layers:     24
max_seq_len:  4096
ffn_mult:     2.6875
rms_norm_eps: 1.0e-5
tie_word_embeddings: true
rope_theta:   10000.0
dropout:      0.0
attention_dropout: 0.0

lr:               2.0e-4
lr_min:           1.0e-5
weight_decay:     0.1
warmup_steps:     2000
max_steps:        200000
grad_clip:        1.0
grad_accum_steps: 16
batch_size:       8

log_every:  50
save_every: 5000
output_dir: checkpoints/500m
