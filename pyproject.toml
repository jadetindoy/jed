[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jed-ai"
version = "0.1.0"
description = "Decoder-only Transformer LLM built from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4.0",
]
eval = [
    "sacrebleu>=2.4.0",
    "datasets>=2.18.0",
]

[tool.setuptools.packages.find]
include = ["model*", "training*", "inference*", "evaluation*", "tokenizer*", "datasets*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
